name: Build APK and release
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DropBridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DropBridge-apk
          path: DropBridge.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DropBridge for Android (latest build)
          body: Build #${{ github.run_number }}. Install over the previous version, no need to uninstall.
          files: DropBridge.apk
